# MangaVeyra with PostgreSQL, from the repository root:
#   cp .env.example .env        # set POSTGRES_PASSWORD, MV_PUBLIC_URL, MV_WORKER_TOKEN
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
# Optional AI workers (they pair with the server through MV_WORKER_TOKEN):
#   docker compose --env-file .env -f deploy/docker-compose.yml --profile gpu up -d          # NVIDIA GPU
#   docker compose --env-file .env -f deploy/docker-compose.yml --profile worker-cpu up -d   # mock backend, no GPU
# Then open http://localhost:8080 and follow the first-run setup.

name: mangaveyra

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/maramharsha/mangaveyra:latest
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      MV_DB: postgres://mangaveyra:${POSTGRES_PASSWORD:-change-me}@postgres:5432/mangaveyra?sslmode=disable
      MV_DATA_DIR: /data
      MV_ADDR: ":8080"
      MV_WORKER_TOKEN: ${MV_WORKER_TOKEN:-}
    ports:
      - "${MV_PORT:-8080}:8080"
    volumes:
      - mangaveyra-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mangaveyra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: mangaveyra
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangaveyra -d mangaveyra"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      target: gpu
    image: ghcr.io/maramharsha/mangaveyra-worker:gpu
    restart: unless-stopped
    environment:
      MV_SERVER_URL: http://app:8080
      MV_WORKER_TOKEN: ${MV_WORKER_TOKEN:-}
      MV_WORKER_NAME: ${MV_WORKER_NAME:-gpu-worker}
      MV_WORKER_BACKEND: ${MV_WORKER_BACKEND:-diffusers}
    # Let running jobs drain on `docker compose stop` (worker MV_DRAIN_TIMEOUT_S defaults to 120 s).
    stop_grace_period: 130s
    volumes:
      - worker-models:/models
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker-cpu:
    profiles: ["worker-cpu"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      target: cpu
    image: ghcr.io/maramharsha/mangaveyra-worker:cpu
    restart: unless-stopped
    environment:
      MV_SERVER_URL: http://app:8080
      MV_WORKER_TOKEN: ${MV_WORKER_TOKEN:-}
      MV_WORKER_NAME: ${MV_WORKER_NAME:-cpu-worker}
      MV_WORKER_BACKEND: mock
    # Let running jobs drain on `docker compose stop` (worker MV_DRAIN_TIMEOUT_S defaults to 120 s).
    stop_grace_period: 130s
    depends_on:
      app:
        condition: service_healthy

volumes:
  mangaveyra-data:
  postgres-data:
  worker-models:
