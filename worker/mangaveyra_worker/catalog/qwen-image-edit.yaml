# Qwen-Image-Edit — instruction edits and text in art (Apache-2.0). ~40 GB in bf16; sequential offload on smaller GPUs.
id: qwen-image-edit
name: Qwen-Image Edit
maker: Qwen (Alibaba)
kind: image
vram_mb: 42000
min_vram_mb: 8000
worker:
  diffusers:
    repo: Qwen/Qwen-Image-Edit
    family: qwen-image
    dtype: bfloat16
    edit: instruct
    offload_mode: sequential
    default_steps: 40
    default_guidance: 4.0
    job_types: [image.edit]
