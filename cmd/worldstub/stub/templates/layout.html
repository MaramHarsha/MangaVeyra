<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} · World dev stub</title>
<style>
:root{--bg:#070A12;--surface:#0D1322;--surface-2:#141C30;--line:#22304F;--text:#E8EEFF;--text-2:#A3B3D9;--text-3:#7C8DB5;--accent:#3D8BFF;--acc-text:#6AA8FF;--success:#3CCB7F;--warning:#F5B83D;--error:#FF5C7A;--focus:#E8EEFF;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#E8EEFF;--surface:#F7F9FF;--surface-2:#DCE3F3;--line:#C9D3EA;--text:#070A12;--text-2:#3E4A66;--text-3:#5A6788;--acc-text:#2459C9;--success:#1F7A4A;--warning:#8A5A00;--error:#C0264A;--focus:#070A12;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--acc-text)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.banner{background:#F5B83D;color:#070A12;padding:8px 16px;font:600 13px/1.4 ui-monospace,monospace;letter-spacing:.04em;text-transform:uppercase}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header .brand{font:800 18px/1 system-ui;letter-spacing:.02em;text-transform:uppercase;color:var(--text);text-decoration:none}
header nav a{margin-left:16px;font-size:14px}
main{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px}
h2{font-size:20px;line-height:1.3;margin:32px 0 12px}
.meta,.mono{font:12px/1.5 ui-monospace,"IBM Plex Mono",monospace;color:var(--text-3)}
.label{font:600 11px/1.4 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.card{background:var(--surface);border:1px solid var(--line);padding:16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.badge{display:inline-block;border:1px solid var(--line);border-radius:2px;padding:1px 8px;font:600 11px/1.6 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.05em}
.badge.ok{color:var(--success);border-color:currentColor}.badge.warn{color:var(--warning);border-color:currentColor}.badge.bad{color:var(--error);border-color:currentColor}.badge.info{color:var(--acc-text);border-color:currentColor}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px/1.4 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.table-wrap{overflow-x:auto}
button,.btn{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:2px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:500 14px/1 system-ui;cursor:pointer;text-decoration:none}
button.primary{background:var(--accent);border-color:var(--accent);color:#070A12;box-shadow:0 0 0 1px rgba(106,168,255,.35),0 0 22px rgba(61,139,255,.45)}
button.danger{color:var(--error)}
input,select,textarea{min-height:40px;padding:8px 12px;border-radius:2px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:inherit}
input.code{font:600 24px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;width:12ch}
form.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sfx{font:900 48px/1 Impact,"Bangers",system-ui;letter-spacing:.04em;color:var(--acc-text);transform:rotate(-4deg);display:inline-block;margin:16px 0}
.cover{width:192px;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);image-rendering:pixelated;background:var(--surface-2)}
ul.plain{padding-left:18px;margin:8px 0}
@media (max-width:640px){header{flex-wrap:wrap}header nav a{margin:0 12px 0 0}button,.btn,input,select{min-height:44px}}
</style>
</head>
<body>
<div class="banner" role="note">Development stub · not the real World platform · in-memory, publicly known keys, nothing here is real</div>
<header>
  <a class="brand" href="/_stub">World <span class="meta">dev stub</span></a>
  <nav aria-label="Stub"><a href="/_stub">Control panel</a><a href="/device">Link a server</a><a href="/v1/meta">API meta</a></nav>
</header>
<main>
{{template "content" .Body}}
</main>
</body>
</html>
