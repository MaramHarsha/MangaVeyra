# Open-weight image models. They run in the local worker (the worker: section tells it how) and are also served
# by aggregators. VRAM figures are for bf16 weights; quantised builds need less. Verify ids and costs before use.
- id: flux2-dev
  name: FLUX.2 [dev]
  maker: Black Forest Labs
  kind: image
  family: flux2
  summary: 32B. Best open-weight quality; non-commercial licence, so private or non-commercial series only.
  uses: [private_series_only]
  capabilities:
    tasks: [generate, edit, sheet]
    refs: true
    max_refs: 6
    lora: true
    edit: true
    text_in_art: true
    bw_screentone: true
    colour: true
    aspect_ratios: ["1:1", "2:3", "3:2", "9:16", "16:9", "1:4"]
    max_resolution: 2048
    pose: true
    controlnet: true
  licence: {id: flux-dev-non-commercial, commercial: false, note: "FLUX [dev] Non-Commercial License: outputs may not be used commercially without a separate licence."}
  hardware: {vram_gb: 24, min_vram_gb: 16, local: true, download_gb: 64}
  providers:
    - {provider: local_worker, model_id: flux2-dev, seconds: 35}
    - {provider: fal, model_id: fal-ai/flux-2, price: {unit: per_image, usd: 0.03}, seconds: 8, notes: verify before use}
    - {provider: replicate, model_id: black-forest-labs/flux-2-dev, price: {unit: per_image, usd: 0.03}, seconds: 12, notes: verify before use}
    - {provider: runware, model_id: "bfl:flux-2@dev", price: {unit: per_image, usd: 0.02}, seconds: 7, notes: verify before use}
  scores: {panel: 86, cover: 88, edit: 80, text_in_art: 80, character_consistency: 82, speed: 55}
  ratings: [all, teen, mature]
  release: "2025-11"
  verify: Checked Sep 2026; verify ids and costs before use.
