# Built-in placeholder models. They are always available, never leave the server and are labelled
# "Built-in placeholder · no AI": image jobs return labelled screentone art sized to the request, text jobs
# return deterministic template text. Every flow works before any real model is connected.
- id: placeholder-image
  name: Built-in placeholder
  maker: MangaVeyra
  kind: image
  summary: Labelled screentone placeholder art sized to the request. No AI.
  uses: [placeholder]
  capabilities:
    tasks: [generate, edit, inpaint, sheet]
    refs: true
    max_refs: 16
    edit: true
    inpaint: true
    bw_screentone: true
    colour: true
    tall_strips: true
    max_resolution: 4096
  licence: {id: agpl-3.0, commercial: true, note: Placeholder art generated by MangaVeyra itself.}
  hardware: {local: true}
  providers:
    - {provider: placeholder, model_id: screentone, seconds: 0.2, free: true}
  scores: {panel: 1, cover: 1, edit: 1, text_in_art: 1, character_consistency: 1, speed: 100}
  ratings: [all, teen, mature, adult]
  verify: Part of MangaVeyra; nothing to verify.
- id: placeholder-upscale
  name: Built-in resize
  maker: MangaVeyra
  kind: upscale
  summary: Plain resampling so upscale flows work without a model. No AI.
  uses: [placeholder]
  capabilities:
    tasks: [upscale]
    max_resolution: 8192
  licence: {id: agpl-3.0, commercial: true}
  hardware: {local: true}
  providers:
    - {provider: placeholder, model_id: resample, seconds: 0.3, free: true}
  scores: {panel: 1, speed: 100}
  ratings: [all, teen, mature, adult]
  verify: Part of MangaVeyra; nothing to verify.
- id: placeholder-text
  name: Built-in placeholder text
  maker: MangaVeyra
  kind: text
  summary: Deterministic template text so script, translation and alt-text flows work without a model. No AI.
  uses: [placeholder]
  capabilities:
    tasks: [text, translate]
    context: 32000
  licence: {id: agpl-3.0, commercial: true}
  hardware: {local: true}
  providers:
    - {provider: placeholder, model_id: template, seconds: 0.05, free: true}
  scores: {text: 1, speed: 100}
  ratings: [all, teen, mature, adult]
  verify: Part of MangaVeyra; nothing to verify.
