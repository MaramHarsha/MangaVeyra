name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (SQLite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: mv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MV_TEST_POSTGRES_URL: postgres://postgres:mv@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: test (SQLite and Postgres)
        run: go test -race -count=1 ./...
      - name: edition check (no payment UI)
        run: go test -count=1 ./internal/editioncheck/...

  templ:
    name: templ generate drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: templ generate
        run: |
          if [ -z "$(find internal -name '*.templ' -print -quit)" ]; then echo "no templ files"; exit 0; fi
          go install github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ)
          templ generate
          git diff --exit-code -- '*_templ.go' || (echo "generated templ files are out of date: run make generate"; exit 1)

  web:
    name: Web build + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx vitest run
        working-directory: web

  worker:
    name: Worker pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./worker[test]" || pip install -e ./worker pytest
      - run: python -m pytest -q
        working-directory: worker

  licence:
    name: Licence scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGPL licence present
        run: grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
      - name: no GPL files under sdk/ (sdk is MIT)
        run: |
          if [ -d sdk ] && grep -rIl -E "GNU (Affero |Lesser )?General Public License" sdk; then
            echo "GPL-licensed files found under sdk/"; exit 1
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
