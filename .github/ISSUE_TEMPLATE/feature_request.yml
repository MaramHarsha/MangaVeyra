name: Feature request
description: Suggest an improvement. Check docs/FEATURES.md first; many features are already planned.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: "What are you trying to do?", description: "The creator, reader or admin need behind the request." }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: "What would help?" }
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and docs/FEATURES.md.
          required: true
